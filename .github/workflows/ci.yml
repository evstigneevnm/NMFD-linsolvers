name: CI

on:
  workflow_dispatch:
    inputs:
      run_cuda:
        description: Run operations integration on a self-hosted CUDA runner
        type: boolean
        default: false
      cuda_arch:
        description: CUDA compute capability without a decimal point
        type: string
        default: '75'
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  cpu-tests:
    name: ${{ matrix.compiler }} / ${{ matrix.test.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang
        test:
          - name: public-headers
            target: check_public_headers_cpu
          - name: orthogonalization
            target: check_orthogonalization_cpu
          - name: arnoldi
            target: check_arnoldi_cpu
          - name: monitor
            target: check_monitor_cpu
          - name: sherman-morrison
            target: check_sherman_morrison_cpu
          - name: direct-solver
            target: check_direct_solver_cpu
          - name: gmres-core
            target: check_gmres_core_cpu
          - name: gmres-legacy
            target: check_gmres_legacy_cpu
          - name: gmres-multigrid
            target: check_gmres_mg_cpu
          - name: operations-integration
            target: check_operations_cpu
          - name: bicgstab
            target: check_bicgstab_cpu
          - name: bicgstabl
            target: check_bicgstabl_cpu
          - name: cgs
            target: check_cgs_cpu
          - name: jacobi
            target: check_jacobi_cpu
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install compiler
        run: |
          sudo apt-get update
          packages=(build-essential make)
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            packages+=(clang libomp-dev)
          fi
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Build and test
        run: |
          make "${{ matrix.test.target }}" \
            CONFIG_FILE="build_configs/config_github_ubuntu_${{ matrix.compiler }}.inc" \
            BUILD_DIR="build/${{ matrix.compiler }}/${{ matrix.test.name }}" \
            TEST_OMP_NUM_THREADS=2

  short-recurrence-json:
    name: JSON / ${{ matrix.solver }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        solver: [bicgstab, bicgstabl, cgs, jacobi]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install optional JSON dependency
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev
      - name: Verify JSON configuration and utility hierarchy
        run: |
          make 'check_${{ matrix.solver }}_json_cpu' \
            CONFIG_FILE=build_configs/config_github_ubuntu_gcc.inc \
            BUILD_DIR=build/json/${{ matrix.solver }} TEST_OMP_NUM_THREADS=2

  sanitizers:
    name: GCC / ASan + UBSan
    needs: cpu-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential make

      - name: Build and test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make run_tests_cpu \
            CONFIG_FILE=build_configs/config_github_ubuntu_sanitizers.inc \
            BUILD_DIR=build/sanitizers \
            TEST_OMP_NUM_THREADS=2

  cuda:
    name: CUDA / operations and short-recurrence integration
    if: github.event_name == 'workflow_dispatch' && inputs.run_cuda
    runs-on: [self-hosted, linux, cuda]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build and test
        env:
          CUDA_ARCH: ${{ inputs.cuda_arch }}
        run: make check_operations_cuda check_bicgstab_cuda check_bicgstabl_cuda check_cgs_cuda check_jacobi_cuda check_sherman_morrison_cuda check_direct_solver_cuda BUILD_DIR=build/cuda CUDA_ARCH="$CUDA_ARCH"
